services:
  - type: web
    name: zentricanalytics-staging
    runtime: node
    plan: starter
    buildCommand: yarn install --frozen-lockfile && yarn build
    preDeployCommand: yarn prisma migrate deploy
    startCommand: yarn start
    disk:
      name: private-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: staging
      - key: APPLICATION_BASE_URL
        value: https://staging.zentricanalytics.com
      - key: AUTH_SECRET
        sync: false
      - key: EMAIL_WORKER_SECRET
        sync: false
      - key: PRIVATE_OBJECT_STORAGE_PROVIDER
        value: local-private
      - key: PRIVATE_UPLOAD_ROOT
        value: /var/data/zentric-private-uploads
      - key: UPLOAD_MAX_BYTES
        value: "20971520"
