services:
  - type: web
    name: zentricanalytics-staging
    runtime: node
    plan: starter
    buildCommand: yarn install --frozen-lockfile && yarn build
    preDeployCommand: yarn hr:release
    startCommand: yarn start
    disk:
      name: private-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: staging
      - key: APPLICATION_BASE_URL
        value: https://staging.zentricanalytics.com
      - key: AUTH_SECRET
        sync: false
      - key: HR_BOOTSTRAP_ENABLED
        sync: false
      - key: HR_BOOTSTRAP_CONFIRM_ENV
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD_HASH
        sync: false
      - key: EMAIL_WORKER_SECRET
        sync: false
      - key: DOCUMENT_SCANNER_SECRET
        sync: false
      - key: MONITORING_SECRET
        sync: false
      - key: OBJECT_STORAGE_PROVIDER
        value: s3-compatible
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: PRIVATE_OBJECT_STORAGE_PROVIDER
        value: local-private
      - key: PRIVATE_UPLOAD_ROOT
        value: /var/data/zentric-private-uploads
      - key: UPLOAD_MAX_BYTES
        value: "20971520"
